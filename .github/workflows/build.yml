name: Build desktop downloads

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: Windows x64
            os: windows-2022
          - target: macOS Apple Silicon
            os: macos-15
          - target: macOS Intel
            os: macos-15-intel
          - target: Linux x64 (Ubuntu 24.04+)
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Install Linux desktop and PDF libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk xvfb xdg-utils fonts-liberation
          python -m playwright install-deps chromium
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Verify release tag matches the application version
        if: startsWith(github.ref, 'refs/tags/')
        shell: python
        run: |
          import os
          from lnmtl.platform_support import VERSION
          assert os.environ['GITHUB_REF_NAME'] == 'v' + VERSION, 'Tag must match the app version'
      - name: Build and test standalone app
        run: python scripts/build_release.py
      - name: Save acceptance-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostics-${{ matrix.os }}
          path: build/packaging/smoke-*/
          if-no-files-found: ignore
      - name: Save platform download
        uses: actions/upload-artifact@v4
        with:
          name: download-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.deb
            release/*.tar.gz
            release/*-SHA256SUMS.txt
            release/*-self-test.json
            release/THIRD_PARTY_NOTICES.md
          if-no-files-found: error

  publish:
    name: Publish verified downloads
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v4
        with:
          pattern: download-*
          merge-multiple: true
          path: release/
      - name: Package the source separately
        run: python scripts/package_source.py
      - name: Publish the release after all platforms pass
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publish_release.py
